name: Validate generator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pypdf==6.19.0 pypdfium2==5.14.0 pdfplumber==0.11.10
      - run: npm run samples
      - run: npm run pdf:verify
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-build-and-pdfs
          path: |
            dist
            output
          retention-days: 14
